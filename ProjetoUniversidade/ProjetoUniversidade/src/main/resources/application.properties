# =============================================
# ? CONFIGURAÇÕES DO BANCO DE DADOS H2
# =============================================
spring.datasource.url=jdbc:h2:mem:universidadeDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# ? CONFIGURAÇÕES DO JPA / HIBERNATE
# =============================================
# Cria o schema automaticamente no início
spring.jpa.hibernate.ddl-auto=create

# Mostra as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# ? GERAR ARQUIVO schema.sql AUTOMATICAMENTE
# =============================================
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;

# =============================================
# ? OUTRAS CONFIGURAÇÕES OPCIONAIS
# =============================================
# Define a porta do servidor
server.port=8080

# Nome da aplicação (aparece no log)
spring.application.name=UniversidadeApp
