# =============================================
# ? CONFIGURA��ES DO BANCO DE DADOS H2
# =============================================
spring.datasource.url=jdbc:h2:mem:universidadeDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# ? CONFIGURA��ES DO JPA / HIBERNATE
# =============================================
# Cria o schema automaticamente no in�cio
spring.jpa.hibernate.ddl-auto=create

# Mostra as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# ? GERAR ARQUIVO schema.sql AUTOMATICAMENTE
# =============================================
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=update
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/schema.sql
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;

# =============================================
# ? OUTRAS CONFIGURA��ES OPCIONAIS
# =============================================
# Define a porta do servidor
server.port=8080

# Nome da aplica��o (aparece no log)
spring.application.name=UniversidadeApp

# Springdoc OpenAPI settings (Swagger UI)
# API docs path (default: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs
# Swagger UI path (accessible at /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

